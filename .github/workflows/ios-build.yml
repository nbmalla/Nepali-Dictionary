name: iOS Build & TestFlight Upload

# Manual-trigger only: no Mac is available for local development, so this
# uses GitHub's hosted macOS runner for everything — signing, archiving, and
# (when the App Store Connect API key secrets are present) uploading the
# build straight to TestFlight.
#
# Required repo secrets (Settings > Secrets and variables > Actions):
#   IOS_DIST_CERT_BASE64          - base64 of the .p12 distribution cert
#   IOS_DIST_CERT_PASSWORD        - password for that .p12
#   IOS_PROVISION_PROFILE_BASE64  - base64 of the .mobileprovision file
#   APPSTORE_KEY_ID               - App Store Connect API key ID
#   APPSTORE_ISSUER_ID            - App Store Connect API issuer ID
#   APPSTORE_API_KEY_BASE64       - base64 of the AuthKey_<KEY_ID>.p8 file
#
# Without the cert/profile secrets, this workflow can't produce a signed
# build at all (archiving will fail) — they're required, not optional.
# Without the App Store Connect API key secrets, it still builds and signs
# the .ipa but skips the TestFlight upload step.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Import signing certificate into a temporary keychain
        env:
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/distribution.p12"

          echo -n "$IOS_DIST_CERT_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

      - name: Install provisioning profile
        env:
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          echo -n "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PROFILE_DIR/japanese_for_nepali.mobileprovision"

      - run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-ipa
          path: build/ios/ipa/*.ipa

      - name: Upload to TestFlight
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
        if: ${{ env.APPSTORE_API_KEY_BASE64 != '' }}
        run: |
          mkdir -p "$HOME/private_keys"
          echo -n "$APPSTORE_API_KEY_BASE64" | base64 --decode -o "$HOME/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8"

          IPA_PATH=$(find build/ios/ipa -name '*.ipa' | head -1)
          xcrun altool --upload-app -f "$IPA_PATH" -t ios \
            --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID"
