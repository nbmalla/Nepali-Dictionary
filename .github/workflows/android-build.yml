name: Android Build Check

# Manual-trigger only for now: verifies the Android target still builds
# (Android SDK isn't installed locally in this project's dev environment).
# Produces a debug-signed release-mode APK artifact only — not suitable for
# Play Store upload as-is. Once a real signing keystore is ready (as GitHub
# Secrets), this workflow can be extended to produce a properly signed
# APK/AAB and upload it to Play Console.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
